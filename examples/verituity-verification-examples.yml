inconsistency:
  note: >-
    WORTH FLAGGING TO THE PROVIDER. The two published request shapes disagree. The developer portal
    sends `{"modules": [...], "payee": {...}}` with `payee.type: "organization"`, while the
    Verification-as-a-Service page sends `{"verifications": [...], "payee": {...}}` with
    `payee.type: "business"`. Both are Verituity's own documentation of the same endpoint. Without
    an OpenAPI there is nothing to arbitrate between them, and an integrator has to guess.
