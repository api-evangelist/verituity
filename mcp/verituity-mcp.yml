tools:
- name: verify_payee
  status: candidate
  description: >-
    Run one or more verification modules against a payee and an optional bank account, and return a
    normalized decision, tier and reason_code per module.
  source_operation: 'POST /v1/verifications (documented at https://verituity.com/developers)'
  input_schema_source: >-
    Would inherit the documented request body: modules[] (organization_identity,
    individual_identity, payment_method, payee_qualification), payee{type, name, address, email,
    phone, date_of_birth, tax_id, payment_account{routing_number, account_number}}.
  consequence: >-
    CONSEQUENTIAL. Each call is billed per module per inquiry ($1.00-$3.00), so an agent calling
    this tool spends real money on every invocation. Any real server should require the
    Idempotency-Key passthrough that the REST API supports.
- name: get_verification
  status: candidate
  description: Fetch a previously created verification inquiry by id, to collect an asynchronous result.
  source_operation: 'GET /v1/verifications/{id} (documented as the poll_url on the 202 response)'
  input_schema_source: 'verification id (sandbox prefix vrf_sbx_)'
  consequence: read-only
coverage:
