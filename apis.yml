aid: verituity
name: Verituity
description: >-
  Verituity is a McLean, Virginia payment integrity platform that verifies the file, the payee, the
  account and the payment instruction at the moment of authorization, before money moves, across any
  payment rail. The platform is organized as six services — Connect (ingest any batch file or REST
  call and normalize it to ISO 20022), Detect (duplicate and out-of-pattern screening), Eligibility
  (payee qualification against OFAC, SAM and payer-private lists), Verify (identity and bank account
  ownership verification), Pay (rail optionality and orchestration across ACH, RTP, wire,
  push-to-card, virtual card, PayPal, Zelle, Venmo, check and cross-border) and Explain (evidence and
  lineage on every decision). Its developer-facing product is Verification-as-a-Service, a single
  POST /v1/verifications call that runs four verification modules and returns one normalized
  decision/tier/reason_code response regardless of which underlying data source answered.
