apis:
- name: Verituity Verification API
  description: >-
    Verification-as-a-Service. A single POST /v1/verifications call declares which verification
    modules to run — organization_identity, individual_identity, payment_method and
    payee_qualification (PQS) — against a payee and an optional payment_account, and returns one
    normalized response carrying a decision, a tier, a reason_code and a score per module. Requests
    are authenticated with an OAuth 2.0 machine-to-machine bearer token (certificate-bound mTLS,
    RFC 8705, for production), carry an Idempotency-Key, and may be forced to deterministic sandbox
    outcomes with the X-Sandbox-Test-Outcome and X-Sandbox-Test-Path headers. Long-running inquiries
    return 202 with a poll_url.
  humanURL: https://verituity.com/developers
  baseURL: https://platform.dev.verituityplatform.com/v1
  x-base-url-note: >-
    This is a NON-PRODUCTION host, and it is the only base URL Verituity publishes anywhere. It is
    printed verbatim on https://verituity.com/developers as the sandbox base_url, and it is live —
    POST /v1/verifications returns HTTP 401 with WWW-Authenticate: Bearer
    realm="verification-api-dev". No production base URL appears on the site, in the code samples,
    or in any well-known document; api.verituityplatform.com resolves but does not answer, and
    platform.verituityplatform.com does not resolve. Recorded as published rather than guessed:
    inventing a production hostname from the domain would be fabrication.
  tags:
  - Verification
  - Identity
  - Payments
  - Payouts
