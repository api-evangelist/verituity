observations:
- >-
  THE GRAPH IS DELIBERATELY FLAT. There is no payee resource, no account resource and no customer
  resource — nothing is stored and re-referenced by id. Every inquiry carries its subject by value.
  That is a real design decision for a verification API (nothing to keep in sync, nothing to
  breach), and it means an integrator gets no list/search surface and cannot ask "what did we
  decide about this payee last month" through the public API.
- >-
  The tier is derived from the payload rather than declared, which couples the data model directly
  to the price: adding tax_id to a payee object silently doubles the cost of an
  organization_identity check.
gaps:
- No published schema, JSON Schema, or field-level type/length/format constraints.
- No enumeration of the full reason_code domain (see errors/verituity-decline-codes.yml).
- No documented shape for the Connect, Detect, Eligibility, Pay or Explain services — only Verify.
