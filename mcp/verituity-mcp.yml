note: >-
  NOTHING IS PUBLISHED. Verituity ships no hosted MCP endpoint and no stdio MCP package: there is no
  mcp.verituity.com (NXDOMAIN), /mcp and /v1/mcp on the published API host both 404, and no npm or
  PyPI package of any kind exists. The tools below are a CANDIDATE derivation from the two
  documented REST operations, recorded so the shape is on file if Verituity ever ships one. No
  `MCPServer` pointer is emitted in apis.yml, because emitting one would credit Verituity with an
  agent surface it does not operate.
