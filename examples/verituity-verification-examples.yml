generated: '2026-09-02'
method: searched
source: https://verituity.com/developers
docs: https://verituity.com/developers
note: >-
  Verituity publishes working request and response examples for its verification API in three
  languages plus a rendered normalized response. They are transcribed here verbatim in shape; the
  synthetic sample identifiers Verituity uses as form filler (tax IDs, account numbers) are
  replaced with obvious placeholders, and no credential material is reproduced.
examples:
- id: create-verification-curl
  operation: POST /v1/verifications
  language: shell
  source: https://verituity.com/developers
  code: |
    curl -X POST https://platform.dev.verituityplatform.com/v1/verifications \
      -H 'Authorization: Bearer <ACCESS_TOKEN>' \
      -H 'Content-Type: application/json' \
      -H 'Idempotency-Key: idmp_<random>' \
      -H 'X-Sandbox-Test-Outcome: approve' \
      -H 'X-Sandbox-Test-Path: default' \
      -d '{"modules":["organization_identity","payment_method"],"payee":{"type":"organization","name":"Northwind Logistics LLC","address":"1200 Harbor Blvd, Tacoma, WA 98402","email":"ap@northwindlogistics.com","phone":"+1 253 555 0142","payment_account":{"routing_number":"125000024","account_number":"<ACCOUNT_NUMBER>"}}}'
- id: create-verification-node
  operation: POST /v1/verifications
  language: javascript
  source: https://verituity.com/developers
  code: |
    const res = await fetch("https://platform.dev.verituityplatform.com/v1/verifications", {
      method: "POST",
      headers: {
        "Authorization": "Bearer <ACCESS_TOKEN>",
        "Content-Type": "application/json",
        "Idempotency-Key": "idmp_<random>",
        "X-Sandbox-Test-Outcome": "approve",
        "X-Sandbox-Test-Path": "default"
      },
      body: JSON.stringify({
        modules: ["organization_identity", "payment_method"],
        payee: {
          type: "organization",
          name: "Northwind Logistics LLC",
          address: "1200 Harbor Blvd, Tacoma, WA 98402",
          payment_account: {
            routing_number: "125000024",
            account_number: "<ACCOUNT_NUMBER>"
          }
        }
      })
    });
    const verification = await res.json();
- id: create-verification-python
  operation: POST /v1/verifications
  language: python
  source: https://verituity.com/developers
  code: |
    import requests

    res = requests.post(
        "https://platform.dev.verituityplatform.com/v1/verifications",
        headers={
            "Authorization": "Bearer <ACCESS_TOKEN>",
            "Content-Type": "application/json",
            "Idempotency-Key": "idmp_<random>",
            "X-Sandbox-Test-Outcome": "approve",
            "X-Sandbox-Test-Path": "default",
        },
        json={
            "modules": ["organization_identity", "payment_method"],
            "payee": {
                "type": "organization",
                "name": "Northwind Logistics LLC",
                "address": "1200 Harbor Blvd, Tacoma, WA 98402",
            },
        },
    )
    verification = res.json()
