gaps:
  note: >-
    THE ERROR REFERENCE IS THE BIGGEST DOCUMENTATION GAP ON THIS API. Verituity documents the happy
    path and the decision semantics thoroughly, but publishes no error-code reference at all: no
    4xx catalogue, no validation error shape, no rate-limit or quota error, no 5xx behaviour, and
    no retry guidance. Everything above the 401 is unknown to an integrator until they hit it in
    production.
