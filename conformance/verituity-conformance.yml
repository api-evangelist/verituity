  note: No trust center, no report request flow, and no auditor named. The claim is a homepage badge.
- id: pcidss
  name: PCI DSS
  claimed: true
  detail: '"The highest service provider tier for handling card data."'
  url: https://verituity.com/
  level_stated: 'Service Provider Level 1 (implied by "highest service provider tier"; the level number is not printed)'
  note: Relevant to the push-to-card and virtual-card payout rails.
- id: ada-wcag
  name: ADA / WCAG
  claimed: true
  detail: '"Accessible payee enrollment and payment selection."'
  url: https://verituity.com/
  version_stated: false
  note: No WCAG version or conformance level (A/AA/AAA) and no VPAT/ACR is published.
- id: public-sector-review
  name: 'Public-sector security review posture (IG / GAO / agency)'
  claimed: true
  detail: '"Built for IG, GAO, and agency security review. Not reconstructed for it."'
  url: https://verituity.com/
  note: >-
    A posture statement, not a certification. No FedRAMP authorization, StateRAMP listing, ATO or
    FIPS validation is claimed anywhere on the site, and none was found.

not_claimed:
  note: >-
    Recorded so a reader can tell a genuine absence from an unchecked field. None of the following
    appear anywhere on verituity.com, and none is asserted here.
  items: [ISO 27001, FedRAMP, StateRAMP, HIPAA, GDPR, CCPA, HITRUST, FAPI, PSD2, FDX, SCIM, OData]

gaps:
- No trust center or compliance portal; certifications are homepage badges with no evidence path.
- No security.txt and no published vulnerability disclosure policy.
- >-
  ISO 20022 conformance cannot be verified from any published contract, because no contract is
  published. The claim is credible and specific, but a buyer must take it on the docs.

